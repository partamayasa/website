<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Nama Digital - Nama Anda</title>
    <!-- Menggunakan Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Menggunakan FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Foto Profil */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
        }

        /* Informasi Profil */
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .title {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .bio {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Daftar Tautan (Links) */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .link-btn i.left-icon {
            font-size: 1.1rem;
            margin-right: 12px;
            width: 24px;
            color: #38bdf8;
        }

        .link-btn .label {
            flex-grow: 1;
            text-align: left;
        }

        .link-btn i.right-icon {
            font-size: 0.8rem;
            color: #64748b;
        }

        /* Efek Hover */
        .link-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .link-btn:hover i.left-icon,
        .link-btn:hover i.right-icon {
            color: #0f172a;
        }

        /* Footer Kecil */
        .footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Ganti tautan gambar di bawah dengan foto Anda -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop&crop=faces" alt="Foto Profil" class="profile-img">
        
        <h1>Nama Lengkap Anda</h1>
        <div class="title">Digital Creator & Developer</div>
        <p class="bio">Membantu mewujudkan ide kreatif Anda menjadi solusi digital yang fungsional dan menarik.</p>

        <!-- Daftar Tombol Tautan -->
        <div class="links-container">
            <!-- WhatsApp -->
            <a href="https://wa.me/6281234567890" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp left-icon"></i>
                <span class="label">WhatsApp</span>
                <i class="fa-solid fa-chevron-right right-icon"></i>
            </a>

            <!-- Email -->
            <a href="mailto:emailanda@domain.com" class="link-btn">
                <i class="fa-solid fa-envelope left-icon"></i>
                <span class="label">Kirim Email</span>
                <i class="fa-solid fa-chevron-right right-icon"></i>
            </a>

            <!-- Website -->
            <a href="https://www.websiteanda.com" target="_blank" class="link-btn">
                <i class="fa-solid fa-globe left-icon"></i>
                <span class="label">Website Resmi</span>
                <i class="fa-solid fa-chevron-right right-icon"></i>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/username" target="_blank" class="link-btn">
                <i class="fa-brands fa-linkedin-in left-icon"></i>
                <span class="label">LinkedIn</span>
                <i class="fa-solid fa-chevron-right right-icon"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/username" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram left-icon"></i>
                <span class="label">Instagram</span>
                <i class="fa-solid fa-chevron-right right-icon"></i>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Nama Anda. All rights reserved.
        </div>
    </div>

</body>
</html>
